spring.application.name=backend

# H2 database stored in a file (survives restarts)
spring.datasource.url=jdbc:h2:file:./data/races
spring.datasource.username=sa
spring.datasource.password=

# Create/update the "races" table from RaceEntity automatically
spring.jpa.hibernate.ddl-auto=update

# Optional: print the SQL Hibernate runs (useful while developing)
spring.jpa.show-sql=true

# Optional: H2 web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
